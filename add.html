<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tambah Kenangan</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Inter&display=swap');
body{
  font-family:'Inter', sans-serif;
  background:linear-gradient(135deg,#bfdbfe,#fbcfe8);
}
.hand{font-family:'Gochi Hand', cursive;}
</style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

<div class="bg-white/80 backdrop-blur-xl p-6 rounded-2xl w-full max-w-md space-y-4">

  <a href="index.html" class="text-indigo-500 hover:underline">← Kembali</a>

  <h1 class="hand text-3xl text-center text-pink-500">
    Tambah Kenangan
  </h1>

  <!-- PILIH TIMELINE -->
  <select id="event" class="w-full p-2 rounded border">
    <option value="awal">Awal</option>
    <option value="meet">Pertemuan Pertama</option>
    <option value="jacob">Kajacob-Dejacob</option>
    <option value="dating">Dating</option>
    <option value="ldr">LDR</option>
  </select>

  <input id="date" type="date" class="w-full p-2 rounded border">

  <textarea id="text"
    placeholder="Tulis ceritanya..."
    class="w-full p-2 rounded border"></textarea>

  <!-- GOOGLE DRIVE LINK -->
  <input id="img"
    placeholder="Paste link Google Drive foto (opsional)"
    class="w-full p-2 rounded border"/>

  <select id="mood" class="w-full p-2 rounded border">
    <option value="❤️">❤️ Bahagia</option>
    <option value="🥺">🥺 Kangen</option>
    <option value="✨">✨ Spesial</option>
    <option value="😂">😂 Ketawa</option>
    <option value="😭">😭 Sedih</option>
  </select>

  <button onclick="addMemory()"
    class="bg-pink-500 hover:bg-pink-600 text-white w-full py-2 rounded-lg font-bold">
    Simpan
  </button>

</div>

<script>
/* ===== PASTIKAN DATA TIMELINE ADA ===== */
const defaultTimeline = [
  { id:"awal", title:"Awal", date:"2025-03-03", memories:[] },
  { id:"meet", title:"Pertemuan Pertama", date:"2025-09-15", memories:[] },
  { id:"jacob", title:"Kajacob-Dejacob", date:"2025-09-26", memories:[] },
  { id:"dating", title:"Dating", date:"2025-10-21", memories:[] },
  { id:"ldr", title:"LDR", date:"2026-01-01", memories:[] }
];

let timeline = JSON.parse(localStorage.getItem("timeline"));
if(!timeline){
  localStorage.setItem("timeline", JSON.stringify(defaultTimeline));
  timeline = defaultTimeline;
}

/* ===== KONVERSI LINK DRIVE ===== */
function driveToImg(url){
  if(!url) return "";
  const match = url.match(/\/d\/(.*?)\//);
  return match
    ? `https://drive.google.com/uc?export=view&id=${match[1]}`
    : url;
}

/* ===== TAMBAH MEMORY ===== */
function addMemory(){
  const eventId = document.getElementById("event").value;
  const date = document.getElementById("date").value;
  const text = document.getElementById("text").value;
  const mood = document.getElementById("mood").value;
  const image = driveToImg(document.getElementById("img").value);

  if(!date || !text){
    alert("Tanggal & cerita wajib diisi 🤍");
    return;
  }

  const event = timeline.find(e => e.id === eventId);
  if(!event){
    alert("Timeline tidak ditemukan");
    return;
  }

  event.memories.push({ date, text, mood, image });
  localStorage.setItem("timeline", JSON.stringify(timeline));

  alert("Kenangan tersimpan 💖");
  window.location.href = "memory.html";
}
</script>

</body>
</html>
