<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Memory Wall</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Inter&display=swap');
body{
font-family:'Inter';
background:linear-gradient(135deg,#bfdbfe,#fbcfe8,#e0e7ff);
}
.hand{font-family:'Gochi Hand';}
</style>
</head>

<body class="min-h-screen p-6">

<a href="index.html" class="text-pink-500">← Kembali</a>
<h1 class="hand text-4xl text-center text-pink-500 mb-10">Memory Wall</h1>

<div id="wall" class="space-y-10"></div>

<script>
const SHEET_ID = "13tPD7Rdj7VVh983Uu1pwaednH0Pa6rsjYxE7oq8K4Vc";
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

fetch(URL)
.then(r => r.text())
.then(t => {
    const json = JSON.parse(t.substr(47).slice(0, -2));
    const rows = json.table.rows;
    const wall = document.getElementById("wall");
    wall.innerHTML = ""; 

    const data = {};

    rows.forEach(r => {
        // Ambil teks yang tampil di sheet (c.f) supaya tanggalnya rapi
        const cols = r.c.map(c => c ? (c.f || c.v) : "");
        const [timestamp, timeline, date, text, mood, photoUrl] = cols;

        // AMBIL ID FOTO: Kita potong link panjangnya supaya sisa ID-nya saja
        let imageId = "";
        if (photoUrl.includes("id=")) {
            imageId = photoUrl.split("id=")[1].split("&")[0];
        } else if (photoUrl.includes("d/")) {
            imageId = photoUrl.split("d/")[1].split("/")[0];
        }

        if (!data[timeline]) data[timeline] = [];
        data[timeline].push({ date, text, mood, imageId });
    });

    Object.keys(data).forEach(tl => {
        let cardsHtml = "";
        data[tl].forEach(m => {
            // Kita pakai link thumbnail supaya ringan dan tembus blokir browser
            const finalImg = `https://drive.google.com/thumbnail?id=${m.imageId}&sz=w600`;
            
            cardsHtml += `
                <div class="bg-white/50 p-4 rounded-2xl shadow-sm border border-white">
                    ${m.imageId ? `<img src="${finalImg}" class="rounded-lg w-full h-48 object-cover mb-3">` : ""}
                    <div class="text-[10px] text-pink-500 font-bold">${m.date}</div>
                    <p class="text-gray-800 my-2">${m.text}</p>
                    <div class="text-2xl">${m.mood}</div>
                </div>
            `;
        });

        wall.innerHTML += `
            <div>
                <h2 class="hand text-3xl text-blue-500 mb-4">✨ ${tl}</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${cardsHtml}</div>
            </div>
        `;
    });
});
</script>

</body>
</html>
