<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Memory Wall</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Inter&display=swap');
body{
font-family:'Inter';
background:linear-gradient(135deg,#bfdbfe,#fbcfe8,#e0e7ff);
}
.hand{font-family:'Gochi Hand';}
</style>
</head>

<body class="min-h-screen p-6">

<a href="index.html" class="text-pink-500">← Kembali</a>
<h1 class="hand text-4xl text-center text-pink-500 mb-10">Memory Wall</h1>

<div id="wall" class="space-y-10"></div>

<script>
const SHEET_ID = "13tPD7Rdj7VVh983Uu1pwaednH0Pa6rsjYxE7oq8K4Vc";
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

fetch(URL)
.then(r => r.text())
.then(t => {
    // Membersihkan data JSON dari Google Sheets
    const json = JSON.parse(t.substr(47).slice(0, -2));
    const rows = json.table.rows;

    const data = {};

    rows.forEach(r => {
        // Mengambil data mentah (f adalah formatted value, v adalah value mentah)
        // Kita gunakan .f jika ada, agar format tanggal di spreadsheet tetap rapi
        const cols = r.c.map(c => c ? (c.f ? c.f : c.v) : "");
        
        // Sesuaikan index ini [0,1,2,3,4,5] dengan urutan kolom di Sheet kamu
        // Biasanya: [Timestamp, Timeline/Kategori, Tanggal, Cerita, Mood, Link Foto]
        const [_, timeline, date, text, mood, photoUrl] = cols;

        // Ekstrak ID Gambar dari URL Google Drive
        let imageId = "";
        if (photoUrl && photoUrl.includes("id=")) {
            imageId = photoUrl.split("id=")[1].split("&")[0];
        } else if (photoUrl && photoUrl.includes("d/")) {
            imageId = photoUrl.split("d/")[1].split("/")[0];
        }

        if (!data[timeline]) data[timeline] = [];
        data[timeline].push({ date, text, mood, imageId });
    });

    const wall = document.getElementById("wall");
    wall.innerHTML = ""; // Bersihkan wall sebelum mengisi

    Object.keys(data).forEach(tl => {
        const sec = document.createElement("div");
        sec.innerHTML = `<h2 class="hand text-3xl text-blue-500 mb-4">✨ ${tl}</h2>`;
        
        const grid = document.createElement("div");
        grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6";

        data[tl].forEach(m => {
            const card = document.createElement("div");
            card.className = "bg-white/60 backdrop-blur-sm p-4 rounded-2xl shadow-sm space-y-3 border border-white/50";
            
            // Link gambar menggunakan format thumbnail agar lebih ringan dan pasti muncul
            const imgSrc = m.imageId ? `https://drive.google.com/uc?export=view&id=${m.imageId}` : "";

            card.innerHTML = `
                ${m.imageId ? `<img src="${imgSrc}" class="rounded-xl w-full h-48 object-cover shadow-inner" onerror="this.src='https://placehold.co/400x300?text=Foto+Privat'">` : ""}
                <div>
                    <div class="text-[10px] font-bold text-pink-400 uppercase tracking-widest">${m.date}</div>
                    <p class="text-gray-700 leading-relaxed mt-1">${m.text}</p>
                    <div class="text-2xl mt-2">${m.mood}</div>
                </div>
            `;
            grid.appendChild(card);
        });

        sec.appendChild(grid);
        wall.appendChild(sec);
    });
});
</script>

</body>
</html>
